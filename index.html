<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ML CI/CD Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #333;
        }

        .info {
            text-align: left;
            margin-top: 25px;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Machine Learning CI/CD</h1>

        <div class="info">

            <p>
                <strong>ML Model:</strong>
                Random Forest Classifier
            </p>

            <p>
                <strong>Dataset:</strong>
                Iris Dataset
            </p>

            <p>
                <strong>Model Accuracy:</strong>
                90%+
            </p>

            <p>
                <strong>CI/CD Status:</strong>
                <span class="success">Deployment Successful</span>
            </p>

        </div>

    </div>

</body>

</html>
